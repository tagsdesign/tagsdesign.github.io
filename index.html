<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/assets/796755c91673121021dd3463928fa9aa.webp">
<title>altruist.xyz</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    cursor:pointer;
    user-select:none;
    z-index:9999;
    transition:.8s;
}

#intro.hide{
    opacity:0;
    pointer-events:none;
}

#hero{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

#video{
    position:absolute;
    left:50%;
    top:0;
    width:100%;
    height:100%;
    transform:translateX(-50%);
    object-fit:cover;
    object-position:center top;
    background:#000;
    opacity:0;
    transition:opacity .8s;
}

#video.show{
    opacity:1;
}

#overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.16) 35%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
}

#credit{
    position:fixed;
    right:5px;
    bottom:5px;
    z-index:9998;
    font-size:12px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.8);
    opacity:0.9;
    pointer-events:none;
    transition:opacity .5s ease;
    user-select:none;
}

.spacer{
    height:140vh;
}

#profile{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;
    opacity:0;
    transform:translateY(120px);
    transition:opacity .6s ease, transform .6s ease;
}

.card{
    width:min(650px,90vw);
    padding:35px;
    border-radius:30px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(0.1px);
    border:1px solid rgba(255,255,255,.08);
    text-align:left;
    box-shadow:0 20px 50px rgba(0,0,0,.10);
}

.profile-top{
    display:flex;
    align-items:center;
    gap:24px;
    position:relative;
    margin-bottom:24px;
}

.profile-text{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.avatar-wrapper{
    position:relative;
    display:inline-flex;
    justify-content:center;
    align-items:center;
}

.profile-dnd{
    position:absolute;
    right:1px;
    bottom:1px;
    width:45px;
    height:45px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(50px);
    z-index:3;
}

.avatar-main{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,.15);
    position:relative;
    z-index:1;
}

.avatar-overlay{
    position:absolute;
    top:50%;
    left:50%;
    width:170px;
    height:170px;
    border-radius:50%;
    object-fit:cover;
    transform:translate(-50%, -50%);
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    z-index:2;
    pointer-events:none;
}

.username{
    margin:0;
    font-size:42px;
    font-weight:bold;
}

.handle{
    margin-top:4px;
    font-size:18px;
    color:rgba(255,255,255,.8);
}

.bio{
    margin-top:10px;
    font-size:22px;
}

.location{
    margin-top:20px;
    opacity:.75;
}

.discord{
    margin-top:30px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px;
    border-radius:18px;
    background:rgba(0,0,0,.45);
}

.discord img{
    width:70px;
    height:70px;
    border-radius:50%;
}

.location {
    align-content: center;
}

.icons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.icons a{
    color:#fff;
    text-decoration:none;
    font-size:36px;
    transition:.3s;
}

.icons a:hover{
    transform:scale(1.15);
}

.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24
}

</style>
</head>

<body>

<div id="intro">
    TAP TO ENTER
</div>

<div id="hero">
    <video
        id="video"
        src="https://github.com/tagsdesign/tagsdesign.github.io/videos.mp4s/bg1.mp4"
        autoplay
        muted
        loop
        playsinline
        controls
        style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:99999;opacity:1;"
    ></video>
</div>

<div id="credit">scenes by theparrygod</div>

<audio id="audio" preload="auto" loop></audio>

<div class="spacer"></div>

<section id="profile">
    <div class="card">

        <div class="profile-top">
            <div class="avatar-wrapper">
                <img src="/assets/796755c91673121021dd3463928fa9aa.webp" class="avatar avatar-main">
                <img src="/assets/a_fcb0de14da228879b455f1f1d3919749.png" class="avatar avatar-overlay">
                <img src="/assets/dnd.png" class="profile-dnd">
            </div>

            <div class="profile-text">
                <div class="username">altruist</div>
                <div class="handle">@atagsdesign</div>
            </div>
        </div>

        <div class="bio">
            Hello, I'm altruist. Crazy dev!
        </div>
    </div>
</section>

<script>
const intro = document.getElementById("intro");
const hero = document.getElementById("hero");
const video = document.getElementById("video");
const audio = document.getElementById("audio");
const profile = document.getElementById("profile");
const card = document.querySelector(".card");
const credit = document.getElementById("credit");

let started = false;
let mediaPairs = [];
let waitTimer;

video.addEventListener("error", () => {
    console.error("VIDEO ERROR:", video.error);
});

video.addEventListener("loadedmetadata", () => {
    console.log("VIDEO METADATA:", {
        source: video.currentSrc,
        width: video.videoWidth,
        height: video.videoHeight,
        duration: video.duration
    });
});

video.addEventListener("loadeddata", () => {
    console.log("VIDEO DATA LOADED");
});

video.addEventListener("canplay", () => {
    console.log("VIDEO CAN PLAY");
});

video.addEventListener("playing", () => {
    console.log("VIDEO PLAYING");
});

audio.addEventListener("error", () => {
    console.error("AUDIO ERROR:", audio.error);
});

async function scanMedia() {
    if (mediaPairs.length) return;

    for (let i = 1; i <= 6; i++) {
        const bg = `videos.mp4s/bg${i}.mp4`;
        const music = `videos.mp4s/audio${i}.mp3`;

        const videoExists = await fetch(bg, {
            method: "HEAD",
            cache: "no-store"
        })
        .then(r => r.ok)
        .catch(() => false);

        const audioExists = await fetch(music, {
            method: "HEAD",
            cache: "no-store"
        })
        .then(r => r.ok)
        .catch(() => false);

        if (videoExists && audioExists) {
            mediaPairs.push({
                video: bg,
                audio: music
            });
        }
    }

    if (!mediaPairs.length) {
        console.error("No media files found.");
    }
}

async function startExperience() {
    if (started) return;

    started = true;
    clearTimeout(waitTimer);

    await scanMedia();

    if (!mediaPairs.length) {
        started = false;
        return;
    }

    const random =
        mediaPairs[Math.floor(Math.random() * mediaPairs.length)];

    video.src = random.video;
    audio.src = random.audio;

    video.load();
    audio.load();

    intro.classList.add("hide");
    video.classList.add("show");

    video.currentTime = 0;
    audio.currentTime = 0;

    try {
        await video.play();
        console.log("VIDEO PLAY SUCCESS");
    } catch (err) {
        console.error("VIDEO PLAY FAILED:", err);
    }

    try {
        await audio.play();
        console.log("AUDIO PLAY SUCCESS");
    } catch (err) {
        console.error("AUDIO PLAY FAILED:", err);
    }

    if (!video.paused && !audio.paused) {
        audio.currentTime = video.currentTime;
    }
}

document.addEventListener("click", startExperience, { once: true });
document.addEventListener("touchstart", startExperience, { once: true });

waitTimer = setTimeout(startExperience, 5000);

setInterval(() => {
    if (video.paused || audio.paused) return;

    const drift = Math.abs(
        video.currentTime - audio.currentTime
    );

    if (drift > 0.03) {
        audio.currentTime = video.currentTime;
    }
}, 30);

video.addEventListener("ended", () => {
    video.currentTime = 0;
    audio.currentTime = 0;

    video.play().catch(() => {});
    audio.play().catch(() => {});
});

function updateScrollEffect() {
    const scroll = window.scrollY;
    const progress = Math.min(1, scroll / 300);

    const profileOpacity = Math.min(1, progress);
    const profileOffset = 120 * (1 - progress);
    const cardOffset = 24 * (1 - progress);

    profile.style.opacity = profileOpacity;
    profile.style.transform = `translateY(${profileOffset}px)`;
    card.style.transform = `translateY(${cardOffset}px)`;
}

window.addEventListener(
    "scroll",
    updateScrollEffect,
    { passive: true }
);

window.addEventListener(
    "resize",
    updateScrollEffect
);

function flickerCredit() {
    const nextOpacity =
        Math.random() > 0.7 ? 0.9 : 0.7;

    credit.style.opacity = nextOpacity;

    setTimeout(
        flickerCredit,
        900 + Math.random() * 1100
    );
}

window.addEventListener("load", () => {
    window.scrollTo(0, 0);
    updateScrollEffect();
    flickerCredit();
});
</script>

</body>
</html>
